  <line x1="52" y1="272" x2="192" y2="272" stroke="#1a1410" stroke-width="1"/>
  <line x1="52" y1="286" x2="192" y2="286" stroke="#1a1410" stroke-width="1"/>

  <!-- нога -->
  <rect x="68" y="340" width="104" height="12" fill="#1a1410" opacity="0.15"/>
