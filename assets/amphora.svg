  <g fill="none" stroke="#1a1410" stroke-width="1.2">
    <path d="M 118 148 Q 122 142 126 148"/>
    <path d="M 116 148 L 113 144 M 120 146 L 119 141 M 124 146 L 125 141 M 128 148 L 131 144"/>
